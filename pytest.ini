[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: fast, no I/O tests for pure functions/business rules
    integration: tests that hit the (in-memory) database and/or several layers
    functional: end-to-end user-scenario tests
